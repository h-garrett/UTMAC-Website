<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UT Music Appreciation Club</title>
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="nav">
        <div class="logo"></div>
        <div class="menu">
            <button class="button">Home</button>
            <button class="button">About</button>
            <button class="button">Events</button>
            <button class="button">Contact</button>
            <button class="button">Join</button>
        </div>
    </div>

    <div class="main">
        <div id="main-container">
            <div class="about">
                <h1>WHAT IS UTMAC?</h1>
                <h2><span>The University of Texas Music Appreciation Club</span> is an organization for
                students at UT to share and expand their music tastes</h2>
            </div>
            <div class="vote-box">
                <h3 class="vote-status">
                    <span class="live-indicator"></span>
                    Voting is live!
                </h3>
                <button class="button" id="vote-link">VOTE NOW</button>
            </div>
        </div>
    </div>
</body>
</html>
